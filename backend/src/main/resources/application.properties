spring.application.name=pharmaassist-backend
server.port=8080

# ---- MySQL ----
spring.datasource.url=jdbc:mysql://localhost:3306/pharmaassist?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---- JWT ----
app.jwt.secret=pharmaassist-super-secret-key-change-me-in-prod-1234567890
app.jwt.expiration-ms=86400000

# ---- AI Service ----
app.ai-service.base-url=http://localhost:8000

# ---- File upload (scanned images) ----
app.upload.dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ---- CORS ----
app.cors.allowed-origin=http://localhost:5173
